name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript tests
        run: node --test tests/test_spacex_tv.js
      - name: Python tests
        if: ${{ !cancelled() }}
        run: python3 -B -m unittest discover -s tests -p 'test_cache_io.py'
